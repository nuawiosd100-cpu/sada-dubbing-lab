# Nixpacks config for Railway. ffmpeg-static downloads its binary during
# npm install (postinstall), so we must not skip install scripts here.
[phases.setup]
nixPkgs = ["nodejs_22", "ffmpeg"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
